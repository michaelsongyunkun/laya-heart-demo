<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Laya-Heart · online demo (sample data)</title>
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/web/styles.css">
  <script type="importmap">{"imports":{"node:fs":"/demo/shims/fs.js","node:path":"/demo/shims/path.js","node:crypto":"/demo/shims/crypto.js","node:os":"/demo/shims/os.js"}}</script>
  <script src="/demo/process.js"></script>
  <style>
.app.is-demo { grid-template-rows: auto auto auto minmax(0, 1fr); }
.is-demo > .demo-note { grid-row: 1; }
.is-demo > .hdr { grid-row: 2; }
.is-demo > .banners { grid-row: 3; }
.is-demo > .main { grid-row: 4; }
@media (max-width: 880px) { .app.is-demo { grid-template-rows: auto auto auto auto; } }
.demo-note { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; margin: 10px 24px 0; padding: 6px 10px 6px 12px;
  border-radius: 12px; font: 12.5px/1.45 system-ui, "Microsoft YaHei", sans-serif;
  color: #3b2a4d; background: rgba(255, 246, 250, 0.92); border: 1px solid #f0c3d6; }
.demo-note strong { color: #b4235a; white-space: nowrap; }
.demo-note span { flex: 1 1 260px; min-width: 0; }
.demo-note a { color: #6d3fd6; font-weight: 600; white-space: nowrap; }
.demo-note button { align-self: center; margin-left: auto; padding: 0 4px; border: 0; background: none; color: inherit; font-size: 16px; line-height: 1; cursor: pointer; opacity: 0.6; }
.demo-note button:hover { opacity: 1; }
.demo-note.is-folded { display: inline-flex; justify-self: start; }
.demo-note.is-folded span, .demo-note.is-folded button { display: none; }
.demo-note.is-folded strong { cursor: pointer; }
/* First run (the 18+ consent pane covers the page): the tag alone, above the pane, so the label shows from the start. */
.app.has-sheet:has(.consent) > .demo-note { position: relative; z-index: 11; display: inline-flex; justify-self: start; }
.app.has-sheet:has(.consent) > .demo-note :is(span, button) { display: none; }
@media (max-width: 880px) { .demo-note { margin: 8px 12px 0; } }
@media (prefers-color-scheme: dark) { .demo-note { color: #eadff2; background: rgba(40, 24, 52, 0.92); border-color: #6b3f63; } .demo-note strong { color: #ff8fb8; } .demo-note a { color: #b89cff; } }</style>
  <script type="module" src="/demo/boot.js"></script>
</head>
<body>
  <div id="app" class="app">
    <header id="hdr" class="hdr"></header>
    <div id="banner" class="banners" aria-live="polite"></div>
    <main id="main" class="main">
      <section id="convo" class="convo" aria-label="conversation">
        <!-- Shown only if the page script never runs (e.g. this file opened from disk); boot replaces it. -->
        <div class="start-hint is-static">
          <p class="empty-title">Laya-Heart</p>
          <p>请在 laya-heart-web 文件夹里运行 <code>npm start</code>，然后打开 <a href="http://127.0.0.1:5178/">http://127.0.0.1:5178/</a>（不要直接双击这个文件）。</p>
          <p class="fine">Run <code>npm start</code> in the laya-heart-web folder, then open <a href="http://127.0.0.1:5178/">http://127.0.0.1:5178/</a> (not this file).</p>
        </div>
      </section>
      <aside id="replies" class="replies" aria-label="replies" aria-live="polite"></aside>
    </main>
    <div id="sheet" class="sheet" hidden></div>
    <div id="toast" class="toast" role="status"></div>
  </div>
</body>
</html>
